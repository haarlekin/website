<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager</title>

    <!-- 1. Force Decap CMS to point to your Netlify backend on every page load -->
    <script>
      localStorage.setItem("netlifySiteURL", "https://haarlekin.netlify.app");
    </script>

    <!-- 2. Load the Netlify Identity Widget -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <!-- 3. Initialize Identity with your full Netlify API endpoint -->
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.init({
          APIUrl: "https://haarlekin.netlify.app/.netlify/identity"
        });
      }
    </script>

    <!-- 4. Load Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </body>
</html>
