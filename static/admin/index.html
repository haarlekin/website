<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Decap CMS</title>
  <style>
    body { margin:0; font-family:sans-serif; background:#f5f5f5; }
    .loader { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; color:#666; gap:20px; }
    .loader .spinner { width:40px; height:40px; border:4px solid #ddd; border-top-color:#1a5276; border-radius:50%; animation:spin 0.8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .error { display:none; color:#c00; text-align:center; padding:20px; }
  </style>
</head>
<body>
  <div class="loader" id="loader">
    <div class="spinner"></div>
    <div>CMS wird geladen…</div>
  </div>
  <div class="error" id="error">
    <p><strong>CMS konnte nicht geladen werden.</strong></p>
    <p id="errmsg"></p>
  </div>
  <script>
    window.addEventListener('error', function(e) {
      document.getElementById('loader').style.display = 'none';
      var err = document.getElementById('error');
      err.style.display = 'block';
      document.getElementById('errmsg').textContent = e.message || 'Unbekannter Fehler';
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/decap-cms@3/dist/decap-cms.js"></script>
</body>
</html>
