local_backend: true
backend:
  name: git-gateway
  repo: haarlekin/website
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/195559b4-b248-4894-8a34-53f760d30098/pkce
  auth_token_endpoint: /sites/195559b4-b248-4894-8a34-53f760d30098/token
  gateway_url: https://gateway.decapbridge.com

  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}>
      via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}>
      via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}>
      via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg

media_folder: "static/images"
public_folder: "/images"

collections:
  - name: "seiten"
    label: "Seiten"
    files:
      - name: "home"
        label: "Startseite"
        file: "content/_index.md"
        media_folder: "carousel"
        public_folder: "carousel"
        fields:
          - {label: "Titel", name: "title", widget: "string"}
          - {
              label: "Bilder (Hero-Karussell)",
              name: "imgs",
              widget: "list",
              required: false,
              field: {label: "Bild", name: "img", widget: "image"},
            }
      - name: "salon-section"
        label: "Salon Galerie"
        file: "content/salon/_index.md"
        media_folder: ""
        public_folder: ""
        fields:
          - {label: "Titel", name: "title", widget: "string"}
          - {
              label: "Bilder",
              name: "imgs",
              widget: "list",
              required: false,
              field: {label: "Bild", name: "img", widget: "image"},
            }
          - {label: "Text", name: "body", widget: "markdown", required: false}
      - name: "instagram"
        label: "Instagram Beiträge"
        file: "data/instagram.yaml"
        fields:
          - label: "Posts"
            name: "posts"
            widget: "list"
            fields:
              - {label: "Instagram URL", name: "url", widget: "string"}
      - name: "beitraege-section"
        label: "Beiträge Übersicht"
        file: "content/beitraege/_index.md"
        fields:
          - {label: "Titel", name: "title", widget: "string"}
          - {label: "Text", name: "body", widget: "markdown", required: false}

  - name: "navigation"
    label: "Navigation"
    files:
      - name: "menu"
        label: "Menü-Titel"
        file: "data/navigation.yaml"
        fields:
          - label: "Menüpunkte"
            name: "items"
            widget: "list"
            fields:
              - {label: "Titel", name: "label", widget: "string"}
              - {label: "Seite", name: "ref", widget: "string"}

  - name: "art"
    label: "Art"
    label_singular: "Art-Eintrag"
    folder: "content/art"
    create: true
    identifier_field: "title"
    extension: "md"
    slug: "{{slug}}"
    path: "{{slug}}/index"
    filter: {field: "type", value: "entry"}
    media_folder: ""
    public_folder: ""
    fields:
      - {label: "Titel", name: "title", widget: "string"}
      - {label: "Datum", name: "date", widget: "datetime", required: false}
      - {label: "Titelbild", name: "cover", widget: "image", required: false}
      - {
          label: "Bilder",
          name: "imgs",
          widget: "list",
          required: false,
          field: {label: "Bild", name: "img", widget: "image"},
        }
      - {
          label: "Videos",
          name: "videos",
          widget: "list",
          required: false,
          field: {label: "Video", name: "video", widget: "file"},
        }
      - {label: "Text", name: "body", widget: "markdown", required: false}

  - name: "award"
    label: "Awards"
    label_singular: "Award-Eintrag"
    folder: "content/award"
    create: true
    identifier_field: "title"
    extension: "md"
    slug: "{{slug}}"
    path: "{{slug}}/index"
    filter: {field: "type", value: "entry"}
    media_folder: ""
    public_folder: ""
    fields:
      - {label: "Titel", name: "title", widget: "string"}
      - {label: "Datum", name: "date", widget: "datetime", required: false}
      - {label: "Titelbild", name: "cover", widget: "image", required: false}
      - {
          label: "Bilder",
          name: "imgs",
          widget: "list",
          required: false,
          field: {label: "Bild", name: "img", widget: "image"},
        }
      - {
          label: "Videos",
          name: "videos",
          widget: "list",
          required: false,
          field: {label: "Video", name: "video", widget: "file"},
        }
      - {label: "Text", name: "body", widget: "markdown", required: false}

  - name: "oeffnungszeiten"
    label: "Öffnungszeiten"
    files:
      - name: "hours"
        label: "Öffnungszeiten"
        file: "data/hours.yaml"
        fields:
          - {label: "Montag", name: "monday", widget: "string"}
          - {label: "Dienstag", name: "tuesday", widget: "string"}
          - {label: "Mittwoch", name: "wednesday", widget: "string"}
          - {label: "Donnerstag", name: "thursday", widget: "string"}
          - {label: "Freitag", name: "friday", widget: "string"}
          - {label: "Samstag", name: "saturday", widget: "string"}
          - {label: "Sonntag", name: "sunday", widget: "string"}

