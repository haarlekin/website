backend:
  name: git-gateway
  branch: main
  site_domain: haarlekin.netlify.app

media_folder: "static/images"
public_folder: "/images"

collections:
  - name: "seiten"
    label: "Seiten"
    files:
      - name: "home"
        label: "Startseite"
        file: "content/_index.md"
        media_folder: "static/carousel"
        public_folder: "/carousel"
        fields:
          - {label: "Titel", name: "title", widget: "string"}
          - {
              label: "Bilder (Hero-Karussell)",
              name: "imgs",
              widget: "list",
              required: false,
              field: {label: "Bild", name: "img", widget: "image"},
            }
      - name: "art-section"
        label: "Art Übersicht"
        file: "content/art/_index.md"
        fields:
          - {label: "Titel", name: "title", widget: "string"}
      - name: "award-section"
        label: "Awards Übersicht"
        file: "content/award/_index.md"
        fields:
          - {label: "Titel", name: "title", widget: "string"}
      - name: "salon-section"
        label: "Salon Galerie"
        file: "content/salon/_index.md"
        media_folder: ""
        public_folder: ""
        fields:
          - {label: "Titel", name: "title", widget: "string"}
          - {
              label: "Bilder",
              name: "imgs",
              widget: "list",
              required: false,
              field: {label: "Bild", name: "img", widget: "image"},
            }
      - name: "beitraege-section"
        label: "Beiträge Übersicht"
        file: "content/beitraege/_index.md"
        fields:
          - {label: "Titel", name: "title", widget: "string"}

  - name: "art"
    label: "Art"
    label_singular: "Art-Eintrag"
    folder: "content/art"
    create: true
    identifier_field: "title"
    extension: "md"
    slug: "{{slug}}"
    path: "{{slug}}/index"
    filter: {field: "type", value: "entry"}
    media_folder: ""
    public_folder: ""
    fields:
      - {label: "Titel", name: "title", widget: "string"}
      - {label: "Titelbild", name: "cover", widget: "image", required: false}
      - {
          label: "Bilder",
          name: "imgs",
          widget: "list",
          required: false,
          field: {label: "Bild", name: "img", widget: "image"},
        }
      - {
          label: "Videos",
          name: "videos",
          widget: "list",
          required: false,
          field: {label: "Video", name: "video", widget: "file"},
        }

  - name: "award"
    label: "Awards"
    label_singular: "Award-Eintrag"
    folder: "content/award"
    create: true
    identifier_field: "title"
    extension: "md"
    slug: "{{slug}}"
    path: "{{slug}}/index"
    filter: {field: "type", value: "entry"}
    media_folder: ""
    public_folder: ""
    fields:
      - {label: "Titel", name: "title", widget: "string"}
      - {label: "Titelbild", name: "cover", widget: "image", required: false}
      - {
          label: "Bilder",
          name: "imgs",
          widget: "list",
          required: false,
          field: {label: "Bild", name: "img", widget: "image"},
        }
      - {
          label: "Videos",
          name: "videos",
          widget: "list",
          required: false,
          field: {label: "Video", name: "video", widget: "file"},
        }

  - name: "oeffnungszeiten"
    label: "Öffnungszeiten"
    files:
      - name: "hours"
        label: "Öffnungszeiten"
        file: "data/hours.yaml"
        fields:
          - {label: "Montag", name: "monday", widget: "string"}
          - {label: "Dienstag", name: "tuesday", widget: "string"}
          - {label: "Mittwoch", name: "wednesday", widget: "string"}
          - {label: "Donnerstag", name: "thursday", widget: "string"}
          - {label: "Freitag", name: "friday", widget: "string"}
          - {label: "Samstag", name: "saturday", widget: "string"}
          - {label: "Sonntag", name: "sunday", widget: "string"}

  - name: "instagram"
    label: "Instagram Beiträge"
    files:
      - name: "posts"
        label: "Instagram Posts"
        file: "data/instagram.yaml"
        fields:
          - label: "Posts"
            name: "posts"
            widget: "list"
            fields:
              - {label: "Instagram URL", name: "url", widget: "string"}
