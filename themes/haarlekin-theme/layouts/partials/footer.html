<footer class="site-footer">
    <div class="site-wrapper">
    <div class="footer-inner">
        <div class="footer-logo">
            <a href="{{ site.Home.RelPermalink }}">
                <img src="{{ "images/haarlekin_blue_highres.png" | absURL }}"
                     alt="Haarlekin"
                     class="footer-logo-img"
                     width="5000" height="906">
            </a>
            <span class="site-subtitle">{{ site.Params.subtitle }}</span>
        </div>
        <div class="footer-links">
            <a href="{{ site.Params.instagram }}" target="_blank" rel="noopener">Instagram</a>
            <a href="{{ site.Params.facebook }}" target="_blank" rel="noopener">Facebook</a>
        </div>
        <div class="footer-contact">
            Haarlekin | {{ site.Params.address }} | Tel.: <a href="tel:{{ site.Params.phone_tel }}">{{ site.Params.phone }}</a> | E-Mail: <a href="mailto:{{ site.Params.email }}">{{ site.Params.email }}</a>
        </div>
    </div>
    </div>
</footer>
