<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}" dir="{{ or site.Language.Direction `ltr` }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <div class="page">
    <div class="site-wrapper">
      {{ partial "header.html" . }}
      <div class="content-area{{ if .IsHome }} content-area--home{{ end }}">
        <main class="main-content">
          {{ block "main" . }}{{ end }}
        </main>
      </div>
    </div>
    {{ partial "footer.html" . }}
  </div>
</body>
</html>
